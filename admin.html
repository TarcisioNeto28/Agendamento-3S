<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel do Administrador | Oficina Auto Elétrica</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#14171C', panel: '#1E222A', panel2: '#262B35', edge: '#333844',
          accent: '#F5A623', accent2: '#FFC857', ok: '#22C55E', danger: '#EF4444',
          ink: '#EDEBE6', dim: '#9CA3AF',
        },
        fontFamily: {
          display: ['Oswald', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  body { background-color: #14171C; }
  .stripe-edge { background-image: repeating-linear-gradient(45deg, #F5A623 0, #F5A623 10px, #14171C 10px, #14171C 20px); }
  .badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; border: 1px solid; }
  ::selection { background: #F5A623; color: #14171C; }
</style>
</head>

<body class="bg-bg text-ink font-body min-h-screen">

  <!-- ============================================================= -->
  <!-- TELA DE SENHA -->
  <!-- ============================================================= -->
  <div id="tela-login" class="min-h-screen flex items-center justify-center p-4">
    <form id="form-login" class="bg-panel border border-edge rounded-2xl p-8 max-w-sm w-full">
      <div class="w-11 h-11 rounded-md bg-panel2 border border-edge flex items-center justify-center mb-4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 class="font-display uppercase tracking-wide text-xl mb-1">Área restrita</h1>
      <p class="text-dim text-sm mb-5">Acesso exclusivo da oficina.</p>
      <input id="input-senha" type="password" placeholder="Senha de acesso"
        class="w-full bg-panel2 border border-edge rounded-lg px-3.5 py-2.5 text-ink mb-3 focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent" />
      <p id="erro-login" class="hidden text-danger text-sm mb-3">Senha incorreta.</p>
      <button type="submit" class="w-full bg-accent hover:bg-accent2 text-bg font-display uppercase tracking-wide font-semibold rounded-xl py-3 transition-colors">Entrar</button>
    </form>
  </div>

  <!-- ============================================================= -->
  <!-- PAINEL -->
  <!-- ============================================================= -->
  <div id="painel" class="hidden">
    <header class="border-b border-edge">
      <div class="h-1.5 stripe-edge"></div>
      <div class="max-w-5xl mx-auto px-5 py-6 flex items-center justify-between gap-4 flex-wrap">
        <div class="flex items-center gap-4">
          <div class="w-11 h-11 rounded-md bg-panel2 border border-edge flex items-center justify-center shrink-0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
          </div>
          <div>
            <h1 class="font-display uppercase tracking-wide text-2xl leading-none">Painel <span class="text-accent">Oficina</span></h1>
            <p class="text-dim text-sm mt-1">Agendamentos da auto elétrica</p>
          </div>
        </div>
        <button id="btn-sair" class="text-dim hover:text-ink text-sm border border-edge rounded-lg px-3 py-2">Sair</button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-5 py-8 space-y-5">

      <!-- Filtro de data -->
      <div class="bg-panel border border-edge rounded-xl p-4 sm:p-5 flex flex-wrap items-end gap-4">
        <div>
          <label for="filtro-data" class="block text-sm text-dim mb-1.5">Data</label>
          <input id="filtro-data" type="date" class="bg-panel2 border border-edge rounded-lg px-3.5 py-2.5 text-ink font-mono focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent" />
        </div>
        <button id="btn-hoje" class="border border-edge hover:border-accent text-dim hover:text-accent text-sm rounded-lg px-4 py-2.5 transition">Hoje</button>
        <button id="btn-atualizar" class="border border-edge hover:border-accent text-dim hover:text-accent text-sm rounded-lg px-4 py-2.5 transition">Atualizar</button>
        <div id="contagem" class="ml-auto text-dim text-sm self-center"></div>
      </div>

      <!-- Lista -->
      <div id="lista-agendamentos" class="space-y-3"></div>
      <p id="estado-vazio" class="hidden text-center text-dim text-sm py-10">Nenhum agendamento para esta data.</p>
    </main>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    // ---------------------------------------------------------------
    // CONFIGURAÇÃO — substitua pelos dados do seu projeto Supabase
    // ---------------------------------------------------------------
    const SUPABASE_URL = 'sb_publishable_1LzCXlyDdmmqBkhBqkMkGg_fspEy18R'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bnZpdG12dnBmdGx5cGh1ZGRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Mzg5NDcsImV4cCI6MjEwMTUxNDk0N30.x1e-jEt1SzRYT9ftjkWo8PzN3JL6UefomePi1XwpzIU'

    // Senha simples de acesso ao painel (troque por algo só seu).
    // Atenção: isso é uma proteção básica no navegador, não uma autenticação
    // real. Para múltiplos funcionários ou mais segurança, use Supabase Auth.
    const ADMIN_PASSWORD = '3sautomotiva'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    // ---------------------------------------------------------------
    // LOGIN SIMPLES (sessão do navegador)
    // ---------------------------------------------------------------
    const telaLogin  = document.getElementById('tela-login')
    const painel     = document.getElementById('painel')
    const formLogin  = document.getElementById('form-login')
    const inputSenha = document.getElementById('input-senha')
    const erroLogin  = document.getElementById('erro-login')

    function entrar() {
      telaLogin.classList.add('hidden')
      painel.classList.remove('hidden')
      carregarAgendamentos()
    }

    if (sessionStorage.getItem('oficina_admin_ok') === '1') {
      entrar()
    }

    formLogin.addEventListener('submit', (e) => {
      e.preventDefault()
      if (inputSenha.value === ADMIN_PASSWORD) {
        sessionStorage.setItem('oficina_admin_ok', '1')
        entrar()
      } else {
        erroLogin.classList.remove('hidden')
      }
    })

    document.getElementById('btn-sair').addEventListener('click', () => {
      sessionStorage.removeItem('oficina_admin_ok')
      location.reload()
    })

    // ---------------------------------------------------------------
    // FILTRO DE DATA
    // ---------------------------------------------------------------
    const filtroData = document.getElementById('filtro-data')
    const lista = document.getElementById('lista-agendamentos')
    const estadoVazio = document.getElementById('estado-vazio')
    const contagem = document.getElementById('contagem')

    function hojeISO() {
      const d = new Date()
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset())
      return d.toISOString().slice(0, 10)
    }
    filtroData.value = hojeISO()

    document.getElementById('btn-hoje').addEventListener('click', () => {
      filtroData.value = hojeISO()
      carregarAgendamentos()
    })
    document.getElementById('btn-atualizar').addEventListener('click', carregarAgendamentos)
    filtroData.addEventListener('change', carregarAgendamentos)

    // ---------------------------------------------------------------
    // CARREGAR E RENDERIZAR AGENDAMENTOS
    // ---------------------------------------------------------------
    const STATUS_ESTILO = {
      confirmado: { texto: 'Confirmado', cor: 'text-accent border-accent/40 bg-accent/10' },
      concluido:  { texto: 'Concluído',  cor: 'text-ok border-ok/40 bg-ok/10' },
      cancelado:  { texto: 'Cancelado',  cor: 'text-danger border-danger/40 bg-danger/10' },
    }

    async function carregarAgendamentos() {
      lista.innerHTML = '<p class="text-dim text-sm text-center py-10">Carregando...</p>'
      estadoVazio.classList.add('hidden')

      const { data, error } = await supabase
        .from('agendamentos')
        .select('*')
        .eq('data_agendamento', filtroData.value)
        .order('hora_agendamento', { ascending: true })

      if (error) {
        lista.innerHTML = `<p class="text-danger text-sm text-center py-10">Erro ao carregar: ${error.message}</p>`
        return
      }

      contagem.textContent = `${data.length} agendamento(s)`

      if (data.length === 0) {
        lista.innerHTML = ''
        estadoVazio.classList.remove('hidden')
        return
      }

      lista.innerHTML = ''
      data.forEach(item => lista.appendChild(criarCard(item)))
    }

    function criarCard(item) {
      const div = document.createElement('div')
      div.className = 'bg-panel border border-edge rounded-xl p-4 sm:p-5'

      const st = STATUS_ESTILO[item.status] || STATUS_ESTILO.confirmado
      const ativo = item.status === 'confirmado'

      div.innerHTML = `
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="font-mono text-lg text-accent border border-accent/30 rounded-lg px-3 py-1.5 bg-accent/5">${item.hora_agendamento.slice(0,5)}</div>
            <div>
              <p class="font-semibold text-ink">${escapeHtml(item.cliente_nome)}</p>
              <p class="text-dim text-sm">${escapeHtml(item.veiculo_modelo)}${item.placa_veiculo ? ' · ' + escapeHtml(item.placa_veiculo) : ''}</p>
            </div>
          </div>
          <span class="badge ${st.cor}">${st.texto}</span>
        </div>

        <div class="grid sm:grid-cols-2 gap-3 mt-4 text-sm">
          <div>
            <p class="text-dim text-xs mb-0.5">Categoria</p>
            <p class="text-ink">${escapeHtml(item.categoria_problema)}</p>
          </div>
          <div>
            <p class="text-dim text-xs mb-0.5">WhatsApp</p>
            <p class="text-ink font-mono">${escapeHtml(item.cliente_whatsapp)}</p>
          </div>
          ${item.descricao_problema ? `
          <div class="sm:col-span-2">
            <p class="text-dim text-xs mb-0.5">Descrição</p>
            <p class="text-ink">${escapeHtml(item.descricao_problema)}</p>
          </div>` : ''}
        </div>

        ${ativo ? `
        <div class="flex gap-2 mt-4 pt-4 border-t border-edge">
          <button data-acao="concluido" class="flex-1 bg-ok/10 hover:bg-ok/20 border border-ok/40 text-ok text-sm font-medium rounded-lg py-2 transition">Marcar como concluído</button>
          <button data-acao="cancelado" class="flex-1 bg-danger/10 hover:bg-danger/20 border border-danger/40 text-danger text-sm font-medium rounded-lg py-2 transition">Cancelar</button>
        </div>` : ''}
      `

      if (ativo) {
        div.querySelector('[data-acao="concluido"]').addEventListener('click', () => atualizarStatus(item.id, 'concluido'))
        div.querySelector('[data-acao="cancelado"]').addEventListener('click', () => atualizarStatus(item.id, 'cancelado'))
      }

      return div
    }

    async function atualizarStatus(id, novoStatus) {
      const acao = novoStatus === 'cancelado' ? 'cancelar' : 'concluir'
      if (!confirm(`Deseja realmente ${acao} este agendamento?`)) return

      const { error } = await supabase
        .from('agendamentos')
        .update({ status: novoStatus })
        .eq('id', id)

      if (error) {
        alert('Não foi possível atualizar: ' + error.message)
        return
      }
      // Cancelar libera automaticamente o horário para novos clientes,
      // graças ao índice único parcial (status = 'confirmado') do banco.
      carregarAgendamentos()
    }

    function escapeHtml(str) {
      const div = document.createElement('div')
      div.textContent = str ?? ''
      return div.innerHTML
    }
  </script>
</body>
</html>
