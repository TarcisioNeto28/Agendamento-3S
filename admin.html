<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel do Administrador | 3S Automotiva</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#14171C', panel: '#1E222A', panel2: '#262B35', edge: '#333844',
          accent: '#F5A623', accent2: '#FFC857', ok: '#22C55E', danger: '#EF4444',
          ink: '#EDEBE6', dim: '#9CA3AF',
        },
        fontFamily: {
          display: ['Oswald', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  body { background-color: #14171C; }
  .stripe-edge { background-image: repeating-linear-gradient(45deg, #F5A623 0, #F5A623 10px, #14171C 10px, #14171C 20px); }
  .badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; border: 1px solid; }
  ::selection { background: #F5A623; color: #14171C; }
</style>
</head>

<body class="bg-bg text-ink font-body min-h-screen">

  <!-- LOGIN -->
  <div id="tela-login" class="min-h-screen flex items-center justify-center p-4">
    <form id="form-login" class="bg-panel border border-edge rounded-2xl p-8 max-w-sm w-full">
      <div class="w-11 h-11 rounded-md bg-panel2 border border-edge flex items-center justify-center mb-4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 class="font-display uppercase tracking-wide text-xl mb-1">Área restrita</h1>
      <p class="text-dim text-sm mb-5">Acesso exclusivo da oficina.</p>
      <input id="input-senha" type="password" placeholder="Senha de acesso"
        class="w-full bg-panel2 border border-edge rounded-lg px-3.5 py-2.5 text-ink mb-3 focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent" />
      <p id="erro-login" class="hidden text-danger text-sm mb-3">Senha incorreta.</p>
      <button type="submit" class="w-full bg-accent hover:bg-accent2 text-bg font-display uppercase tracking-wide font-semibold rounded-xl py-3 transition-colors">Entrar</button>
    </form>
  </div>

  <!-- PAINEL -->
  <div id="painel" class="hidden">
    <header class="border-b border-edge">
      <div class="h-1.5 stripe-edge"></div>
      <div class="max-w-5xl mx-auto px-5 py-6 flex items-center justify-between gap-4 flex-wrap">
        <div class="flex items-center gap-4">
          <div class="w-11 h-11 rounded-md bg-panel2 border border-edge flex items-center justify-center shrink-0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
          </div>
          <div>
            <h1 class="font-display uppercase tracking-wide text-2xl leading-none">Painel <span class="text-accent">Oficina</span></h1>
            <p class="text-dim text-sm mt-1">Agendamentos da 3S Elétrica Automotiva</p>
          </div>
        </div>
        <button id="btn-sair" class="text-dim hover:text-ink text-sm border border-edge rounded-lg px-3 py-2">Sair</button>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-5 py-8 space-y-5">
      
      <!-- ABAS -->
      <div class="flex border-b border-edge gap-4 text-sm font-medium">
        <button id="aba-diario" class="pb-3 border-b-2 border-accent text-accent font-semibold">Agendamentos Diários</button>
        <button id="aba-relatorio" class="pb-3 border-b-2 border-transparent text-dim hover:text-ink">Relatório Mensal e Faturamento</button>
      </div>

      <!-- VISÃO DIÁRIA -->
      <div id="secao-diario" class="space-y-5">
        <div class="bg-panel border border-edge rounded-xl p-4 sm:p-5 flex flex-wrap items-end gap-4">
          <div>
            <label for="filtro-data" class="block text-sm text-dim mb-1.5">Data</label>
            <input id="filtro-data" type="date" class="bg-panel2 border border-edge rounded-lg px-3.5 py-2.5 text-ink font-mono focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent" />
          </div>
          <button id="btn-hoje" class="border border-edge hover:border-accent text-dim hover:text-accent text-sm rounded-lg px-4 py-2.5 transition">Hoje</button>
          <button id="btn-atualizar" class="border border-edge hover:border-accent text-dim hover:text-accent text-sm rounded-lg px-4 py-2.5 transition">Atualizar</button>
          <div id="contagem" class="ml-auto text-dim text-sm self-center"></div>
        </div>

        <div id="lista-agendamentos" class="space-y-3"></div>
        <p id="estado-vazio" class="hidden text-center text-dim text-sm py-10">Nenhum agendamento para esta data.</p>
      </div>

      <!-- RELATÓRIO MENSAL -->
      <div id="secao-relatorio" class="hidden space-y-5">
        <div class="bg-panel border border-edge rounded-xl p-4 sm:p-5 flex flex-wrap items-end justify-between gap-4">
          <div class="flex flex-wrap items-end gap-4">
            <div>
              <label for="filtro-mes" class="block text-sm text-dim mb-1.5">Mês de Referência</label>
              <input id="filtro-mes" type="month" class="bg-panel2 border border-edge rounded-lg px-3.5 py-2.5 text-ink font-mono focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent" />
            </div>
            <div>
              <label for="filtro-status-relatorio" class="block text-sm text-dim mb-1.5">Status</label>
              <select id="filtro-status-relatorio" class="bg-panel2 border border-edge rounded-lg px-3.5 py-2.5 text-ink focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent">
                <option value="concluido" selected>Apenas Concluídos</option>
                <option value="todos">Todos os Status</option>
              </select>
            </div>
            <button id="btn-buscar-relatorio" class="bg-panel2 border border-edge hover:border-accent text-dim hover:text-accent text-sm rounded-lg px-4 py-2.5 transition">Filtrar Mês</button>
          </div>

          <button id="btn-exportar-csv" class="bg-ok/10 hover:bg-ok/20 border border-ok/40 text-ok text-sm font-semibold rounded-lg px-5 py-2.5 transition flex items-center gap-2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Exportar CSV
          </button>
        </div>

        <!-- RESUMO FINANCEIRO DO MÊS -->
        <div id="resumo-financeiro" class="bg-panel border border-edge rounded-xl p-4 flex items-center justify-between">
          <div>
            <p class="text-dim text-xs uppercase tracking-wider">Total de Agendamentos</p>
            <p id="total-qtd-mes" class="text-2xl font-bold font-mono text-ink">0</p>
          </div>
          <div class="text-right">
            <p class="text-dim text-xs uppercase tracking-wider">Faturamento Total do Mês</p>
            <p id="total-faturado-mes" class="text-2xl font-bold font-mono text-ok">R$ 0,00</p>
          </div>
        </div>

        <div id="lista-relatorio" class="space-y-3"></div>
        <p id="estado-vazio-relatorio" class="hidden text-center text-dim text-sm py-10">Nenhum registro encontrado para este mês.</p>
      </div>

    </main>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL = 'https://ovnvitmvvpftlyphuddf.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92bnZpdG12dnBmdGx5cGh1ZGRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Mzg5NDcsImV4cCI6MjEwMTUxNDk0N30.x1e-jEt1SzRYT9ftjkWo8PzN3JL6UefomePi1XwpzIU'
    const ADMIN_PASSWORD = '3sautomotiva'

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const telaLogin  = document.getElementById('tela-login')
    const painel     = document.getElementById('painel')
    const formLogin  = document.getElementById('form-login')
    const inputSenha = document.getElementById('input-senha')
    const erroLogin  = document.getElementById('erro-login')

    function entrar() {
      telaLogin.classList.add('hidden')
      painel.classList.remove('hidden')
      carregarAgendamentos()
    }

    if (sessionStorage.getItem('oficina_admin_ok') === '1') {
      entrar()
    }

    formLogin.addEventListener('submit', (e) => {
      e.preventDefault()
      if (inputSenha.value === ADMIN_PASSWORD) {
        sessionStorage.setItem('oficina_admin_ok', '1')
        entrar()
      } else {
        erroLogin.classList.remove('hidden')
      }
    })

    document.getElementById('btn-sair').addEventListener('click', () => {
      sessionStorage.removeItem('oficina_admin_ok')
      location.reload()
    })

    // NAVEGAÇÃO ENTRE ABAS
    const abaDiario = document.getElementById('aba-diario')
    const abaRelatorio = document.getElementById('aba-relatorio')
    const secaoDiario = document.getElementById('secao-diario')
    const secaoRelatorio = document.getElementById('secao-relatorio')

    abaDiario.addEventListener('click', () => {
      abaDiario.className = 'pb-3 border-b-2 border-accent text-accent font-semibold'
      abaRelatorio.className = 'pb-3 border-b-2 border-transparent text-dim hover:text-ink'
      secaoDiario.classList.remove('hidden')
      secaoRelatorio.classList.add('hidden')
    })

    abaRelatorio.addEventListener('click', () => {
      abaRelatorio.className = 'pb-3 border-b-2 border-accent text-accent font-semibold'
      abaDiario.className = 'pb-3 border-b-2 border-transparent text-dim hover:text-ink'
      secaoRelatorio.classList.remove('hidden')
      secaoDiario.classList.add('hidden')
      carregarRelatorioMensal()
    })

    // CONTROLE DIÁRIO
    const filtroData = document.getElementById('filtro-data')
    const lista = document.getElementById('lista-agendamentos')
    const estadoVazio = document.getElementById('estado-vazio')
    const contagem = document.getElementById('contagem')

    function hojeISO() {
      const d = new Date()
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset())
      return d.toISOString().slice(0, 10)
    }
    filtroData.value = hojeISO()

    document.getElementById('btn-hoje').addEventListener('click', () => {
      filtroData.value = hojeISO()
      carregarAgendamentos()
    })
    document.getElementById('btn-atualizar').addEventListener('click', carregarAgendamentos)
    filtroData.addEventListener('change', carregarAgendamentos)

    const STATUS_ESTILO = {
      confirmado: { texto: 'Confirmado', cor: 'text-accent border-accent/40 bg-accent/10' },
      concluido:  { texto: 'Concluído',  cor: 'text-ok border-ok/40 bg-ok/10' },
      cancelado:  { texto: 'Cancelado',  cor: 'text-danger border-danger/40 bg-danger/10' },
    }

    async function carregarAgendamentos() {
      lista.innerHTML = '<p class="text-dim text-sm text-center py-10">Carregando...</p>'
      estadoVazio.classList.add('hidden')

      const { data, error } = await supabase
        .from('agendamentos')
        .select('*')
        .eq('data_agendamento', filtroData.value)
        .order('hora_agendamento', { ascending: true })

      if (error) {
        lista.innerHTML = `<p class="text-danger text-sm text-center py-10">Erro ao carregar: ${error.message}</p>`
        return
      }

      contagem.textContent = `${data.length} agendamento(s)`

      if (data.length === 0) {
        lista.innerHTML = ''
        estadoVazio.classList.remove('hidden')
        return
      }

      lista.innerHTML = ''
      data.forEach(item => lista.appendChild(criarCard(item)))
    }

    function criarCard(item) {
      const div = document.createElement('div')
      div.className = 'bg-panel border border-edge rounded-xl p-4 sm:p-5'

      const st = STATUS_ESTILO[item.status] || STATUS_ESTILO.confirmado

      div.innerHTML = `
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="font-mono text-lg text-accent border border-accent/30 rounded-lg px-3 py-1.5 bg-accent/5">${item.hora_agendamento.slice(0,5)}</div>
            <div>
              <p class="font-semibold text-ink">${escapeHtml(item.cliente_nome)}</p>
              <p class="text-dim text-sm">${escapeHtml(item.veiculo_modelo)}${item.placa_veiculo ? ' · ' + escapeHtml(item.placa_veiculo) : ''}</p>
            </div>
          </div>
          <span class="badge ${st.cor}">${st.texto}</span>
        </div>

        <div class="grid sm:grid-cols-2 gap-3 mt-4 text-sm">
          <div>
            <p class="text-dim text-xs mb-0.5">Categoria Solicitada</p>
            <p class="text-ink">${escapeHtml(item.categoria_problema)}</p>
          </div>
          <div>
            <p class="text-dim text-xs mb-0.5">WhatsApp</p>
            <p class="text-ink font-mono">${escapeHtml(item.cliente_whatsapp)}</p>
          </div>
          ${item.descricao_problema ? `
          <div class="sm:col-span-2">
            <p class="text-dim text-xs mb-0.5">Descrição do Problema</p>
            <p class="text-ink">${escapeHtml(item.descricao_problema)}</p>
          </div>` : ''}
          
          <div class="sm:col-span-2 mt-2 pt-2 border-t border-edge/50 space-y-2">
            <div class="grid sm:grid-cols-3 gap-2">
              <div class="sm:col-span-2">
                <label class="text-dim text-xs block mb-1">Serviço Executado:</label>
                <input type="text" data-campo="servico" value="${escapeHtml(item.servico_executado || '')}" placeholder="Ex: Troca de alternador" class="w-full bg-panel2 border border-edge rounded-lg px-3 py-1.5 text-ink text-sm focus:outline-none focus:ring-1 focus:ring-accent" />
              </div>
              <div>
                <label class="text-dim text-xs block mb-1">Valor Cobrado (R$):</label>
                <input type="number" step="0.01" data-campo="valor" value="${item.valor_servico || ''}" placeholder="0.00" class="w-full bg-panel2 border border-edge rounded-lg px-3 py-1.5 text-ink text-sm font-mono focus:outline-none focus:ring-1 focus:ring-accent" />
              </div>
            </div>
            <button data-acao="salvar-servico" class="w-full bg-panel2 hover:bg-edge border border-edge text-accent text-xs py-2 rounded-lg transition font-medium">Salvar Alterações do Serviço</button>
          </div>
        </div>

        <div class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-edge">
          <button data-acao="notificar" class="flex-1 bg-accent/10 hover:bg-accent/20 border border-accent/40 text-accent text-sm font-medium rounded-lg py-2 transition">Enviar Confirmação no WhatsApp</button>
          ${item.status === 'confirmado' ? `
            <button data-acao="concluido" class="flex-1 bg-ok/10 hover:bg-ok/20 border border-ok/40 text-ok text-sm font-medium rounded-lg py-2 transition">Concluído</button>
            <button data-acao="cancelado" class="flex-1 bg-danger/10 hover:bg-danger/20 border border-danger/40 text-danger text-sm font-medium rounded-lg py-2 transition">Cancelar</button>
          ` : ''}
        </div>
      `

      const btnNotificar = div.querySelector('[data-acao="notificar"]')
      const btnConcluido = div.querySelector('[data-acao="concluido"]')
      const btnCancelado = div.querySelector('[data-acao="cancelado"]')
      const btnSalvarServico = div.querySelector('[data-acao="salvar-servico"]')
      const inputServico = div.querySelector('[data-campo="servico"]')
      const inputValor = div.querySelector('[data-campo="valor"]')

      if (btnNotificar) btnNotificar.addEventListener('click', () => notificarClienteWhatsApp(item))
      if (btnConcluido) btnConcluido.addEventListener('click', () => atualizarStatus(item.id, 'concluido'))
      if (btnCancelado) btnCancelado.addEventListener('click', () => atualizarStatus(item.id, 'cancelado'))
      
      if (btnSalvarServico) {
        btnSalvarServico.addEventListener('click', async () => {
          const textoServico = inputServico.value.trim()
          const valorNum = parseFloat(inputValor.value) || 0

          const { error } = await supabase
            .from('agendamentos')
            .update({ 
              servico_executado: textoServico,
              valor_servico: valorNum
            })
            .eq('id', item.id)

          if (error) {
            alert('Erro ao salvar serviço: ' + error.message)
          } else {
            alert('Serviço e valor atualizados!')
            if (!secaoRelatorio.classList.contains('hidden')) {
              carregarRelatorioMensal()
            }
          }
        })
      }

      return div
    }

    function notificarClienteWhatsApp(item) {
      const numLimpo = item.cliente_whatsapp.replace(/\D/g, '')
      const numCompleto = numLimpo.length <= 11 ? '55' + numLimpo : numLimpo
      const dataFmt = formatarDataBR(item.data_agendamento)

      const textoCliente = [
        `Olá *${item.cliente_nome}*! 👋`,
        `Seu agendamento na *3S Elétrica Automotiva* foi *CONFIRMADO* com sucesso!`,
        ``,
        `📅 *Data:* ${dataFmt}`,
        `⏰ *Horário:* ${item.hora_agendamento.slice(0,5)}`,
        `🚗 *Veículo:* ${item.veiculo_modelo}`,
        ``,
        `Te aguardamos na oficina!`
      ].join('\n')

      window.open(`https://wa.me/${numCompleto}?text=${encodeURIComponent(textoCliente)}`, '_blank')
    }

    async function atualizarStatus(id, novoStatus) {
      const acao = novoStatus === 'cancelado' ? 'cancelar' : 'concluir'
      if (!confirm(`Deseja realmente ${acao} este agendamento?`)) return

      const { error } = await supabase
        .from('agendamentos')
        .update({ status: novoStatus })
        .eq('id', id)

      if (error) {
        alert('Não foi possível atualizar: ' + error.message)
        return
      }
      carregarAgendamentos()
    }

    // RELATÓRIO MENSAL E FATURAMENTO
    const filtroMes = document.getElementById('filtro-mes')
    const filtroStatusRelatorio = document.getElementById('filtro-status-relatorio')
    const listaRelatorio = document.getElementById('lista-relatorio')
    const estadoVazioRelatorio = document.getElementById('estado-vazio-relatorio')
    const totalQtdMes = document.getElementById('total-qtd-mes')
    const totalFaturadoMes = document.getElementById('total-faturado-mes')

    filtroMes.value = hojeISO().slice(0, 7)

    document.getElementById('btn-buscar-relatorio').addEventListener('click', carregarRelatorioMensal)

    let dadosRelatorioAtual = []

    async function carregarRelatorioMensal() {
      listaRelatorio.innerHTML = '<p class="text-dim text-sm text-center py-10">Carregando relatório...</p>'
      estadoVazioRelatorio.classList.add('hidden')

      const [ano, mes] = filtroMes.value.split('-')
      
      const inicioMes = `${ano}-${mes}-01`
      const ultimoDiaNum = new Date(ano, mes, 0).getDate()
      const fimMes = `${ano}-${mes}-${ultimoDiaNum}`

      let query = supabase
        .from('agendamentos')
        .select('*')
        .gte('data_agendamento', inicioMes)
        .lte('data_agendamento', fimMes)
        .order('data_agendamento', { ascending: true })

      if (filtroStatusRelatorio.value === 'concluido') {
        query = query.eq('status', 'concluido')
      }

      const { data, error } = await query

      if (error) {
        listaRelatorio.innerHTML = `<p class="text-danger text-sm text-center py-10">Erro: ${error.message}</p>`
        return
      }

      dadosRelatorioAtual = data

      // Atualizar totalizadores
      const faturamentoTotal = data.reduce((acc, cur) => acc + Number(cur.valor_servico || 0), 0)
      totalQtdMes.textContent = data.length
      totalFaturadoMes.textContent = faturamentoTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })

      if (data.length === 0) {
        listaRelatorio.innerHTML = ''
        estadoVazioRelatorio.classList.remove('hidden')
        return
      }

      listaRelatorio.innerHTML = ''
      data.forEach(item => listaRelatorio.appendChild(criarCard(item)))
    }

    // EXPORTAR CSV
    document.getElementById('btn-exportar-csv').addEventListener('click', () => {
      if (!dadosRelatorioAtual || dadosRelatorioAtual.length === 0) {
        alert('Não há dados para exportar neste mês.')
        return
      }

      const cabecalhos = ['Data', 'Hora', 'Cliente', 'WhatsApp', 'Veiculo', 'Placa', 'Categoria', 'Status', 'Servico Executado', 'Valor (R$)']
      
      const linhas = dadosRelatorioAtual.map(item => [
        formatarDataBR(item.data_agendamento),
        item.hora_agendamento.slice(0,5),
        `"${(item.cliente_nome || '').replace(/"/g, '""')}"`,
        `"${(item.cliente_whatsapp || '').replace(/"/g, '""')}"`,
        `"${(item.veiculo_modelo || '').replace(/"/g, '""')}"`,
        `"${(item.placa_veiculo || '').replace(/"/g, '""')}"`,
        `"${(item.categoria_problema || '').replace(/"/g, '""')}"`,
        item.status,
        `"${(item.servico_executado || '').replace(/"/g, '""')}"`,
        (item.valor_servico || 0).toFixed(2).replace('.', ',')
      ])

      const conteudoCsv = '\uFEFF' + [cabecalhos.join(';'), ...linhas.map(l => l.join(';'))].join('\n')
      
      const blob = new Blob([conteudoCsv], { type: 'text/csv;charset=utf-8;' })
      const url = URL.createObjectURL(blob)
      const link = document.createElement('a')
      
      link.setAttribute('href', url)
      link.setAttribute('download', `relatorio_agendamentos_${filtroMes.value}.csv`)
      document.body.appendChild(link)
      link.click()
      document.body.removeChild(link)
    })

    function formatarDataBR(iso) {
      if (!iso) return ''
      const [ano, mes, dia] = iso.split('-')
      return `${dia}/${mes}/${ano}`
    }

    function escapeHtml(str) {
      const div = document.createElement('div')
      div.textContent = str ?? ''
      return div.innerHTML
    }
  </script>
</body>
</html>
